name: Jenkins repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jenkins-repository-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Compose requires these settings to render the model. They are
      # disposable placeholders and are never used to start Jenkins.
      JENKINS_ADMIN_ID: ci-placeholder
      JENKINS_ADMIN_PASSWORD: ci-placeholder-only
      JENKINS_TARGET_REPO_OWNER: ci-owner
      JENKINS_TARGET_REPO_NAME: ci-repository
      JENKINS_GITHUB_APP_ID: "12345678"
      JENKINS_GITHUB_APP_CREDENTIAL_ID: github-app
      JENKINS_MULTIBRANCH_JOB_NAME: ci-job
      JENKINS_MARKER_FILE: package.json
      JENKINS_CANDIDATE_PATHS: sample-app/
      JENKINS_TUTOR_WEB_DIRECTORY: sample-tutor-web
      JENKINS_E2E_JOB_NAME: sample-e2e
      JENKINS_PRIMARY_CHECK_NAME: required-ci
      JENKINS_CANDIDATE_CHECK_NAME: candidate-validation
      JENKINS_APP_DIRECTORY: sample-app
      JENKINS_SITE_URL: https://example.invalid
      JENKINS_TEST_PLATFORM_JOB_NAME: sample-test-platform
      JENKINS_TEST_PLATFORM_NODE: node
      JENKINS_TEST_PLATFORM_ADAPTER_ROOT: /usr/share/jenkins/test-platform-contract
      JENKINS_HTTP_BIND_IP: 192.168.218.2
      DOCKER_SOCKET_GID: "999"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Set up Node.js for portfolio profile contract
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3

      - name: Test portfolio profile contract
        run: node --test integration/portfolio-profile-contract/test/*.test.mjs

      - name: Validate Compose model
        run: docker compose --profile build-images --file compose.yaml config --quiet

      - name: Set up Ruby for YAML validation
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'

      - name: Parse Jenkins Configuration as Code YAML
        run: ruby -e 'require "yaml"; YAML.parse_file("casc/jenkins.yaml")'

      - name: Validate trusted pipeline contract
        shell: pwsh
        run: ./scripts/verify-pipeline-contract.ps1

      - name: Set up Jenkins-compatible Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Parse trusted Groovy with Jenkins-pinned Groovy
        shell: pwsh
        run: ./scripts/verify-groovy-syntax.ps1
