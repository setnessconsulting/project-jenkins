jenkins:
  systemMessage: "Private repository CI pilot with opt-in centrally trusted profiles. Do not use for production deployment."
  mode: NORMAL
  # One built-in executor so test-platform-contract Authorize and Finalize
  # (agent label built-in) can run. CasC reload with 0 queues those stages
  # forever. Do not raise this; repository work stays on ephemeral agents.
  numExecutors: 1
  slaveAgentPort: -1
  # Listing nodeMonitors replaces the set. Keep the core monitors and lower
  # only TemporarySpaceMonitor (tmpSpace) to 100MB so the node-22.14 canary
  # agent is not taken offline for a small /tmp. diskSpace stays at the
  # Jenkins core default of 1GB.
  nodeMonitors:
    - "architecture"
    - "clock"
    - diskSpace:
        freeSpaceThreshold: "1GB"
    - "responseTime"
    - swapSpace:
        ignored: true
    - tmpSpace:
        freeSpaceThreshold: "100MB"
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          name: "Jenkins Administrator"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - docker:
        name: "setness-ephemeral-agents"
        containerCap: 1
        # Agent memoryLimit/memorySwap are 4096 MiB so one agent + the 4g
        # controller fit a static 12 GiB Hyper-V guest (OS/docker overhead
        # remains). containerCap stays 1. Do not raise without more guest RAM.
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"
        templates:
          - name: "setness-node22-one-build"
            labelString: "setness-ephemeral"
            mode: EXCLUSIVE
            instanceCapStr: "1"
            retentionStrategy:
              idleMinutes: 0
            remoteFs: "/home/jenkins/agent"
            pullStrategy: PULL_NEVER
            removeVolumes: true
            stopTimeout: 10
            connector:
              jnlp:
                jenkinsUrl: "http://controller:8080/"
                user: "1000"
            dockerTemplateBase:
              image: "jenkins-pilot-agent:node-22.23.3"
              network: "setness-jenkins-private"
              cpus: "4.0"
              memoryLimit: 4096
              memorySwap: 4096
              privileged: false
              # Host Docker socket for Test Platform docker-backed suites on
              # this dedicated pilot VM only. Agent image docker group GID 988
              # matches the guest docker group so jenkins can use the socket.
              mounts:
                - "type=bind,source=/var/run/docker.sock,destination=/var/run/docker.sock"
              environment:
                - "JENKINS_WEB_SOCKET=true"
          - name: "setness-node22-14-one-build"
            labelString: "setness-node22-14-ephemeral"
            mode: EXCLUSIVE
            instanceCapStr: "1"
            retentionStrategy:
              idleMinutes: 0
            remoteFs: "/home/jenkins/agent"
            pullStrategy: PULL_NEVER
            removeVolumes: true
            stopTimeout: 10
            connector:
              jnlp:
                jenkinsUrl: "http://controller:8080/"
                user: "1000"
            dockerTemplateBase:
              image: "jenkins-pilot-agent:node-22.14.0"
              network: "setness-jenkins-private"
              cpus: "4.0"
              memoryLimit: 4096
              memorySwap: 4096
              privileged: false
              # Host Docker socket for Test Platform docker-backed suites on
              # this dedicated pilot VM only. Agent image docker group GID 988
              # matches the guest docker group so jenkins can use the socket.
              mounts:
                - "type=bind,source=/var/run/docker.sock,destination=/var/run/docker.sock"
              environment:
                - "JENKINS_WEB_SOCKET=true"
          - name: "setness-web-ci-node22-one-build"
            labelString: "setness-web-ci-node22-ephemeral"
            mode: EXCLUSIVE
            instanceCapStr: "1"
            retentionStrategy:
