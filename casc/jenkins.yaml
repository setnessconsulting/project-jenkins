jenkins:
  systemMessage: "Private single-repository CI pilot. Do not use for production deployment."
  mode: NORMAL
  numExecutors: 0
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          name: "Jenkins Administrator"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - docker:
        name: "setness-ephemeral-agents"
        containerCap: 1
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"
        templates:
          - name: "setness-node22-one-build"
            labelString: "setness-ephemeral"
            mode: EXCLUSIVE
            instanceCap: 1
            retentionStrategy:
              $class: com.nirima.jenkins.plugins.docker.strategy.DockerOnceRetentionStrategy
              idleMinutes: 0
            remoteFs: "/home/jenkins/agent"
            pullStrategy: PULL_NEVER
            removeVolumes: true
            stopTimeout: 10
            connector:
              jnlp:
                jenkinsUrl: "http://controller:8080/"
                user: "1000"
            dockerTemplateBase:
              image: "jenkins-pilot-agent:node-22.23.3"
              network: "setness-jenkins-private"
              cpus: "4.0"
              memoryLimit: 8192
              memorySwap: 8192
              privileged: false
              environment:
                - "JENKINS_WEB_SOCKET=true"
          - name: "setness-node24-one-build"
            labelString: "setness-node24-ephemeral"
            mode: EXCLUSIVE
            instanceCap: 1
            retentionStrategy:
              $class: com.nirima.jenkins.plugins.docker.strategy.DockerOnceRetentionStrategy
              idleMinutes: 0
            remoteFs: "/home/jenkins/agent"
            pullStrategy: PULL_NEVER
            removeVolumes: true
            stopTimeout: 10
            connector:
              jnlp:
                jenkinsUrl: "http://controller:8080/"
                user: "1000"
            dockerTemplateBase:
              image: "jenkins-pilot-agent:node-24.21.0"
              network: "setness-jenkins-private"
              cpus: "4.0"
              memoryLimit: 6144
              memorySwap: 6144
              privileged: false
              environment:
                - "JENKINS_WEB_SOCKET=true"
          - name: "setness-e2e-one-build"
            labelString: "setness-e2e-ephemeral"
            mode: EXCLUSIVE
            instanceCap: 1
            retentionStrategy:
              $class: com.nirima.jenkins.plugins.docker.strategy.DockerOnceRetentionStrategy
              idleMinutes: 0
            remoteFs: "/home/jenkins/agent"
            pullStrategy: PULL_NEVER
            removeVolumes: true
            stopTimeout: 10
            connector:
              jnlp:
                jenkinsUrl: "http://controller:8080/"
                user: "1000"
            dockerTemplateBase:
              image: "jenkins-pilot-agent:node-22.23.3-playwright-1.62.1"
              network: "setness-jenkins-private"
              cpus: "4.0"
              memoryLimit: 8192
              memorySwap: 8192
              privileged: false
              environment:
                - "JENKINS_WEB_SOCKET=true"

jobs:
  - file: /usr/share/jenkins/casc/jobs.groovy

unclassified:
  location:
    url: "http://127.0.0.1:18080/"
